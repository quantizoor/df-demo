name: mvp-paid-loop

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact reviewed 40-character controller commit
        required: true
        type: string
      campaign_id:
        description: MVP campaign identifier
        required: true
        type: string
      confirmation:
        description: Type RUN_MVP:<campaign_id>
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: dark-factory-mvp-paid-${{ inputs.campaign_id }}
  cancel-in-progress: false

jobs:
  one-iteration:
    if: inputs.confirmation == format('RUN_MVP:{0}', inputs.campaign_id)
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    environment: dark-factory-mvp-paid
    env:
      CI: "true"
      DF_CLOUD_EXECUTION: "1"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      DF_MVP_SOURCE_COMMIT: ${{ inputs.source_commit }}
      DF_MVP_CAMPAIGN_ID: ${{ inputs.campaign_id }}
      DF_MVP_MAX_ITERATIONS: "1"
      DAYTONA_API_URL: ${{ vars.DAYTONA_API_URL }}
      DAYTONA_TARGET: ${{ vars.DAYTONA_TARGET }}
      DF_MVP_DAYTONA_OPTIMIZER_IMAGE: ${{ vars.DF_MVP_DAYTONA_OPTIMIZER_IMAGE }}
      DF_MVP_DAYTONA_EVALUATOR_IMAGE: ${{ vars.DF_MVP_DAYTONA_EVALUATOR_IMAGE }}
      DF_DAYTONA_VOLUME_ID: ${{ vars.DF_DAYTONA_VOLUME_ID }}
      DF_DAYTONA_VOLUME_SUBPATH: ${{ vars.DF_DAYTONA_VOLUME_SUBPATH }}
      DF_HARBOR_DAYTONA_SECRET_SOURCE: ${{ vars.DF_HARBOR_DAYTONA_SECRET_SOURCE }}
      DF_FOUNDRY_BASE_URL: ${{ vars.DF_FOUNDRY_BASE_URL }}
      DF_OPTIMIZER_DEPLOYMENT: ${{ vars.DF_OPTIMIZER_DEPLOYMENT }}
      DF_EVALUATED_DEPLOYMENT: ${{ vars.DF_EVALUATED_DEPLOYMENT }}
      DF_OPTIMIZER_SECRET_SOURCE: ${{ vars.DF_OPTIMIZER_SECRET_SOURCE }}
      DF_EVALUATED_SECRET_SOURCE: ${{ vars.DF_EVALUATED_SECRET_SOURCE }}
      DF_PI_GITHUB_OWNER: ${{ vars.DF_PI_GITHUB_OWNER }}
      DF_PI_GITHUB_REPOSITORY: ${{ vars.DF_PI_GITHUB_REPOSITORY }}
      DF_PI_BRANCH: ${{ vars.DF_PI_BRANCH }}
      DF_PI_BASELINE_COMMIT: ${{ vars.DF_PI_BASELINE_COMMIT }}
      DF_PI_BASELINE_TREE: ${{ vars.DF_PI_BASELINE_TREE }}
      DF_PI_PACKAGE_LOCK_SHA256: ${{ vars.DF_PI_PACKAGE_LOCK_SHA256 }}
      DF_GITHUB_SECRET_SOURCE: ${{ vars.DF_GITHUB_SECRET_SOURCE }}

    steps:
      - name: Verify the manual cloud request
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_ACTIONS:-}" = "true"
          test "${RUNNER_ENVIRONMENT:-}" = "github-hosted"
          [[ "$DF_MVP_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DF_MVP_CAMPAIGN_ID" =~ ^[a-z0-9]([a-z0-9-]{0,62}[a-z0-9])?$ ]]
          [[ "$DF_MVP_DAYTONA_OPTIMIZER_IMAGE" =~ ^[A-Za-z0-9][A-Za-z0-9._:/-]{0,446}@sha256:[a-f0-9]{64}$ ]]
          [[ "$DF_MVP_DAYTONA_EVALUATOR_IMAGE" =~ ^[A-Za-z0-9][A-Za-z0-9._:/-]{0,446}@sha256:[a-f0-9]{64}$ ]]
          test "${DF_MVP_DAYTONA_OPTIMIZER_IMAGE##*@}" != "${DF_MVP_DAYTONA_EVALUATOR_IMAGE##*@}"
          test "${{ inputs.confirmation }}" = "RUN_MVP:$DF_MVP_CAMPAIGN_ID"

      - name: Check out the exact reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false

      - name: Verify source identity and reviewed lock
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DF_MVP_SOURCE_COMMIT"
          test -s pnpm-lock.yaml
          test "$(git status --porcelain=v1 --untracked-files=all)" = ""

      - name: Set up exact Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0

      - name: Verify and build entirely on the cloud runner
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          test "$(pnpm --version)" = "11.9.0"
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm check
          pnpm build

      - name: Build a deterministic exact-source controller bundle
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          test -s scripts/mvp-optimizer-worker.mjs || missing+=("MVP_OPTIMIZER_WORKER_SOURCE")
          test -s scripts/package-pi-runtime.mjs || missing+=("MVP_PI_PACKAGER_SOURCE")
          test -s dist/mvp/cloud-optimizer-worker.js || missing+=("MVP_OPTIMIZER_WORKER_BUILD")
          test -s dist/mvp/cloud-evaluator-worker.js || missing+=("MVP_EVALUATOR_WORKER_BUILD")
          test -s dist/mvp/evaluator-runtime.js || missing+=("MVP_EVALUATOR_RUNTIME_BUILD")
          test -s dist/mvp/evaluator-runtime-node.js || missing+=("MVP_EVALUATOR_NODE_RUNTIME_BUILD")
          test -s claude-plugin/server/hook-guard.js || missing+=("MVP_OPTIMIZER_PLUGIN_BUILD")
          if ! test -s src/terminal-bench/assets/dark_factory_pi.py; then
            missing+=("MVP_PI_HARBOR_ADAPTER_SOURCE")
          fi
          if test "${#missing[@]}" -ne 0; then
            joined="$(IFS=,; echo "${missing[*]}")"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "missing=$joined" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -cf "$RUNNER_TEMP/df-mvp-controller.tar" \
            dist node_modules scripts claude-plugin \
            src/terminal-bench/assets/dark_factory_pi.py
          gzip -n "$RUNNER_TEMP/df-mvp-controller.tar"
          bundle="$RUNNER_TEMP/df-mvp-controller.tar.gz"
          digest="$(sha256sum "$bundle" | cut -d' ' -f1)"
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "path=$bundle" >> "$GITHUB_OUTPUT"
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"

      - name: Launch exactly one paid MVP iteration
        id: launch
        shell: bash
        env:
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
          DF_MVP_CONTROLLER_BUNDLE_PATH: ${{ steps.bundle.outputs.path }}
          DF_MVP_CONTROLLER_BUNDLE_SHA256: ${{ steps.bundle.outputs.sha256 }}
        run: |
          set -euo pipefail
          if test "${{ steps.bundle.outputs.ready }}" != "true"; then
            node -e '
              const missing = process.argv[1].split(",").filter(Boolean);
              const receipt = {
                schemaVersion: 1,
                domain: "dark-factory.mvp-source-readiness.v1",
                status: "blocked",
                actualIterationsCompleted: 0,
                sourceCommit: process.env.DF_MVP_SOURCE_COMMIT,
                missingPrerequisites: missing,
                containsTaskIdentifiers: false,
                containsTaskLiterals: false,
                containsGraderData: false,
                containsRawTraces: false,
              };
              require("node:fs").writeFileSync(
                "mvp-paid-loop-receipt.json",
                `${JSON.stringify(receipt)}\n`,
                { flag: "wx", mode: 0o600 },
              );
            ' "${{ steps.bundle.outputs.missing }}"
            echo "exit_code=2" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          node dist/mvp/cloud-cli.js > mvp-paid-loop-receipt.json
          status="$?"
          set -e
          test -s mvp-paid-loop-receipt.json
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"

      - name: Admit only a bounded task-free launch receipt
        id: admit
        if: always()
        shell: bash
        env:
          DF_MVP_LAUNCH_EXIT_CODE: ${{ steps.launch.outputs.exit_code }}
          DF_MVP_CONTROLLER_BUNDLE_SHA256: ${{ steps.bundle.outputs.sha256 }}
          DAYTONA_API_KEY: receipt-admission-placeholder
        run: |
          set -euo pipefail
          test -s mvp-paid-loop-receipt.json
          test "$(wc -c < mvp-paid-loop-receipt.json)" -le 4194304
          node --input-type=module - <<'NODE'
          import fs from "node:fs";
          import { inspectMvpCloudEnvironment } from "./dist/mvp/cloud-config.js";

          const receipt = JSON.parse(
            fs.readFileSync("mvp-paid-loop-receipt.json", "utf8"),
          );
          const readiness = inspectMvpCloudEnvironment(process.env);
          const expectedConfigurationHash =
            readiness.configuration?.configurationHash ?? null;
          const exactKeys = (value, expected) =>
            value !== null &&
            typeof value === "object" &&
            !Array.isArray(value) &&
            Object.getPrototypeOf(value) === Object.prototype &&
            Object.keys(value).length === expected.length &&
            Object.keys(value).every((key) => expected.includes(key));
          const sensitivityIsFalse =
            receipt.containsTaskIdentifiers === false &&
            receipt.containsTaskLiterals === false &&
            receipt.containsGraderData === false &&
            receipt.containsRawTraces === false;
          const digestFrom = (name) => {
            const value = process.env[name] ?? "";
            return value.slice(value.lastIndexOf("@") + 1);
          };
          const cloudBaseKeys = [
            "schemaVersion",
            "domain",
            "campaignId",
            "configurationHash",
            "sourceCommit",
            "workflowRunId",
            "workflowRunAttempt",
            "provider",
            "regionClass",
            "imageDigests",
            "controllerBundleSha256",
            "maximumIterations",
            "protocol",
            "outerSandboxResources",
            "isolation",
            "executions",
            "startedAt",
            "finishedAt",
            "containsTaskIdentifiers",
            "containsTaskLiterals",
            "containsGraderData",
            "containsRawTraces",
          ];
          const launchExitCode = process.env.DF_MVP_LAUNCH_EXIT_CODE;
          if (launchExitCode === "0") {
            const successKeys = [
              ...cloudBaseKeys,
              "status",
              "actualIterationsCompleted",
              "iteration",
            ];
            if (
              !exactKeys(receipt, successKeys) ||
              receipt.schemaVersion !== 3 ||
              receipt.domain !== "dark-factory.mvp-cloud-launch.v3" ||
              receipt.status !== "actual-iteration-completed" ||
              receipt.actualIterationsCompleted !== 1 ||
              receipt.campaignId !== process.env.DF_MVP_CAMPAIGN_ID ||
              receipt.sourceCommit !== process.env.DF_MVP_SOURCE_COMMIT ||
              receipt.workflowRunId !== process.env.GITHUB_RUN_ID ||
              receipt.workflowRunAttempt !==
                Number(process.env.GITHUB_RUN_ATTEMPT) ||
              receipt.provider !== "daytona" ||
              receipt.regionClass !== "eu" ||
              receipt.configurationHash !== expectedConfigurationHash ||
              !exactKeys(receipt.imageDigests, ["optimizer", "evaluator"]) ||
              receipt.imageDigests.optimizer !==
                digestFrom("DF_MVP_DAYTONA_OPTIMIZER_IMAGE") ||
              receipt.imageDigests.evaluator !==
                digestFrom("DF_MVP_DAYTONA_EVALUATOR_IMAGE") ||
              receipt.imageDigests.optimizer ===
                receipt.imageDigests.evaluator ||
              receipt.controllerBundleSha256 !==
                process.env.DF_MVP_CONTROLLER_BUNDLE_SHA256 ||
              !sensitivityIsFalse
            ) {
              process.exit(1);
            }
          } else {
            const launchFailure =
              receipt.domain === "dark-factory.mvp-launch-failure.v1" &&
              exactKeys(receipt, [
                "schemaVersion",
                "domain",
                "status",
                "actualIterationsCompleted",
                "failureCode",
                "containsTaskIdentifiers",
                "containsTaskLiterals",
                "containsGraderData",
                "containsRawTraces",
              ]) &&
              receipt.schemaVersion === 1 &&
              receipt.status === "failed-closed" &&
              /^MVP_[A-Z0-9_]+$/.test(receipt.failureCode ?? "");
            const configurationReadiness =
              receipt.domain ===
                "dark-factory.mvp-configuration-readiness.v1" &&
              exactKeys(receipt, [
                "schemaVersion",
                "domain",
                "status",
                "actualIterationsCompleted",
                "missingPrerequisites",
                "invalidConfiguration",
                "containsTaskIdentifiers",
                "containsTaskLiterals",
                "containsGraderData",
                "containsRawTraces",
              ]) &&
              receipt.schemaVersion === 1 &&
              receipt.status === "blocked" &&
              Array.isArray(receipt.missingPrerequisites) &&
              Array.isArray(receipt.invalidConfiguration);
            const sourceReadiness =
              receipt.domain === "dark-factory.mvp-source-readiness.v1" &&
              exactKeys(receipt, [
                "schemaVersion",
                "domain",
                "status",
                "actualIterationsCompleted",
                "sourceCommit",
                "missingPrerequisites",
                "containsTaskIdentifiers",
                "containsTaskLiterals",
                "containsGraderData",
                "containsRawTraces",
              ]) &&
              receipt.schemaVersion === 1 &&
              receipt.status === "blocked" &&
              receipt.sourceCommit === process.env.DF_MVP_SOURCE_COMMIT &&
              Array.isArray(receipt.missingPrerequisites);
            const cloudBlocked =
              receipt.domain === "dark-factory.mvp-cloud-launch.v3" &&
              exactKeys(receipt, [
                ...cloudBaseKeys,
                "status",
                "actualIterationsCompleted",
                "missingPrerequisites",
              ]) &&
              receipt.schemaVersion === 3 &&
              receipt.status === "blocked" &&
              receipt.campaignId === process.env.DF_MVP_CAMPAIGN_ID &&
              receipt.configurationHash === expectedConfigurationHash &&
              receipt.sourceCommit === process.env.DF_MVP_SOURCE_COMMIT &&
              exactKeys(receipt.imageDigests, ["optimizer", "evaluator"]) &&
              receipt.imageDigests.optimizer ===
                digestFrom("DF_MVP_DAYTONA_OPTIMIZER_IMAGE") &&
              receipt.imageDigests.evaluator ===
                digestFrom("DF_MVP_DAYTONA_EVALUATOR_IMAGE") &&
              Array.isArray(receipt.missingPrerequisites);
            if (
              !["1", "2"].includes(launchExitCode ?? "") ||
              receipt.actualIterationsCompleted !== 0 ||
              !(
                launchFailure ||
                configurationReadiness ||
                sourceReadiness ||
                cloudBlocked
              ) ||
              !sensitivityIsFalse
            ) {
              process.exit(1);
            }
          }
          fs.writeFileSync(
            "mvp-paid-loop-receipt.json",
            `${JSON.stringify(receipt)}\n`,
            { encoding: "utf8", mode: 0o600 },
          );
          NODE

      - name: Upload only the task-free launch or readiness receipt
        if: ${{ always() && steps.admit.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mvp-paid-loop-${{ inputs.campaign_id }}-${{ inputs.source_commit }}
          path: mvp-paid-loop-receipt.json
          if-no-files-found: error
          retention-days: 14

      - name: Require an actual completed iteration
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.launch.outputs.exit_code }}" = "0"
          node -e '
            const receipt = JSON.parse(
              require("node:fs").readFileSync(
                "mvp-paid-loop-receipt.json",
                "utf8",
              ),
            );
            if (
              receipt.schemaVersion !== 3 ||
              receipt.domain !== "dark-factory.mvp-cloud-launch.v3" ||
              receipt.status !== "actual-iteration-completed" ||
              receipt.actualIterationsCompleted !== 1 ||
              receipt.imageDigests?.optimizer !==
                process.env.DF_MVP_DAYTONA_OPTIMIZER_IMAGE.slice(
                  process.env.DF_MVP_DAYTONA_OPTIMIZER_IMAGE.lastIndexOf("@") + 1,
                ) ||
              receipt.imageDigests?.evaluator !==
                process.env.DF_MVP_DAYTONA_EVALUATOR_IMAGE.slice(
                  process.env.DF_MVP_DAYTONA_EVALUATOR_IMAGE.lastIndexOf("@") + 1,
                )
            ) {
              process.exit(1);
            }
          '
