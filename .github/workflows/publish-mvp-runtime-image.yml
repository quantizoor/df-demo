name: publish-mvp-runtime-image

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact 40-character main-branch commit to build
        required: true
        type: string
      confirmation:
        description: Type PUBLISH-MVP:<source_commit>
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: dark-factory-mvp-runtime-${{ inputs.source_commit }}
  cancel-in-progress: false

jobs:
  quality:
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.confirmation == format('PUBLISH-MVP:{0}', inputs.source_commit)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CI: "true"
      RUNNER_ENVIRONMENT: ${{ runner.environment }}
      DF_CLOUD_EXECUTION: "1"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      DF_REQUESTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
    steps:
      - name: Verify cloud-hosted protected source
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_ACTIONS:-}" = "true"
          test "${RUNNER_ENVIRONMENT:-}" = "github-hosted"
          [[ "$DF_REQUESTED_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$DF_REQUESTED_SOURCE_COMMIT" = "$GITHUB_SHA"

      - name: Checkout exact requested commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false

      - name: Require immutable source, lock, and runtime pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DF_REQUESTED_SOURCE_COMMIT"
          test -s pnpm-lock.yaml
          test -s containers/mvp-runtime.Containerfile
          test -s containers/mvp-runtime-pins.json
          test "$(git status --porcelain=v1 --untracked-files=all)" = ""
          syntax_directive="$(head -n 1 containers/mvp-runtime.Containerfile)"
          if [[ "$syntax_directive" == "# syntax="* ]]; then
            [[ "$syntax_directive" =~ ^#[[:space:]]syntax=[A-Za-z0-9][A-Za-z0-9._:/-]{0,446}@sha256:[a-f0-9]{64}$ ]]
          fi

          jq -e '
            def exact_keys($expected):
              (keys | sort) == ($expected | sort);
            def sha256:
              type == "string" and test("^[a-f0-9]{64}$");
            def immutable_image:
              type == "string" and
              test("^[A-Za-z0-9][A-Za-z0-9._:/-]{0,446}@sha256:[a-f0-9]{64}$");
            def https_url:
              type == "string" and
              startswith("https://") and
              length <= 2048 and
              ((contains("\u0000") or contains("\r") or contains("\n")) | not);
            def semver:
              type == "string" and
              test("^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\\+[0-9A-Za-z.-]+)?$");
            . as $pins |
            exact_keys([
              "schemaVersion",
              "domain",
              "platform",
              "runtimeAbi",
              "runtimeBaseImage",
              "debianSnapshot",
              "buildxVersion",
              "buildkitImage",
              "node",
              "claudeCode",
              "bun",
              "harbor",
              "requiredExecutables",
              "reservedIds",
              "defaultUser",
              "maximumUncompressedBytes"
            ]) and
            .schemaVersion == 1 and
            .domain == "dark-factory.mvp-runtime-pins.v1" and
            .platform == "linux/amd64" and
            .runtimeAbi == "linux-x64-glibc" and
            (.runtimeBaseImage | immutable_image) and
            (.debianSnapshot |
              type == "string" and
              test("^[0-9]{8}T[0-9]{6}Z$")) and
            (.buildxVersion |
              type == "string" and
              test("^v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$")) and
            (.buildkitImage | immutable_image) and
            (.node |
              exact_keys([
                "version",
                "npmVersion",
                "url",
                "archiveSha256",
                "executable"
              ]) and
              (.version |
                type == "string" and
                test("^24\\.[0-9]+\\.[0-9]+$")) and
              (.npmVersion | semver) and
              (.url | https_url) and
              (.archiveSha256 | sha256) and
              .executable == "/usr/bin/node") and
            (.claudeCode |
              exact_keys([
                "version",
                "url",
                "archiveSha256",
                "executable"
              ]) and
              .version == "2.1.217" and
              (.url | https_url) and
              (.archiveSha256 | sha256) and
              .executable == "/usr/local/bin/claude") and
            (.bun |
              exact_keys([
                "version",
                "url",
                "archiveSha256",
                "executable",
                "variant",
                "target"
              ]) and
              (.version | semver) and
              (.url | https_url) and
              (.archiveSha256 | sha256) and
              .executable == "/usr/local/bin/bun" and
              .variant == "bun-linux-x64-baseline" and
              .target == "bun-linux-x64-baseline") and
            (.harbor |
              exact_keys([
                "version",
                "wheelUrl",
                "wheelSha256",
                "executable",
                "extra"
              ]) and
              .version == "0.20.0" and
              (.wheelUrl | https_url) and
              (.wheelSha256 | sha256) and
              .executable == "/usr/local/bin/harbor" and
              (.extra |
                type == "string" and
                test("^[a-z0-9][a-z0-9._-]{0,63}$"))) and
            (.requiredExecutables |
              type == "array" and
              length >= 13 and
              length <= 64 and
              length == (unique | length) and
              all(
                type == "string" and
                test("^/[A-Za-z0-9._+/-]+$")
              )) and
            ([
              "/bin/sh",
              "/bin/false",
              "/usr/bin/node",
              "/usr/bin/env",
              "/usr/bin/git",
              "/usr/bin/npm",
              "/usr/bin/tar",
              "/usr/bin/gzip",
              "/usr/bin/python3",
              "/usr/bin/sha256sum",
              "/usr/bin/mkdir",
              "/usr/bin/chown",
              "/usr/bin/pkill",
              "/usr/bin/pgrep",
              "/usr/local/bin/claude",
              "/usr/local/bin/harbor",
              "/usr/local/bin/bun"
            ] - .requiredExecutables | length == 0) and
            ($pins.requiredExecutables |
              index($pins.node.executable) != null) and
            ($pins.requiredExecutables |
              index($pins.claudeCode.executable) != null) and
            ($pins.requiredExecutables |
              index($pins.bun.executable) != null) and
            ($pins.requiredExecutables |
              index($pins.harbor.executable) != null) and
            .reservedIds == [65532, 65533] and
            (.defaultUser |
              exact_keys(["uid", "gid", "name"]) and
              (.uid |
                type == "number" and
                floor == . and
                . > 0 and
                . < 65532) and
              (.gid |
                type == "number" and
                floor == . and
                . > 0 and
                . < 65532) and
              (.name |
                type == "string" and
                test("^[a-z_][a-z0-9_-]{0,31}$"))) and
            (.maximumUncompressedBytes |
              type == "number" and
              floor == . and
              . >= 1 and
              . <= 5368709120)
          ' containers/mvp-runtime-pins.json >/dev/null

      - name: Set up exact Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0

      - name: Install and verify
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          test "$(pnpm --version)" = "11.9.0"
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm check
          pnpm build

  publish:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: dark-factory-image-publish
    permissions:
      contents: read
      packages: write
    env:
      CI: "true"
      RUNNER_ENVIRONMENT: ${{ runner.environment }}
      DF_CLOUD_EXECUTION: "1"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      DF_REQUESTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
      DF_IMAGE_TAG: ${{ inputs.source_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Verify cloud-hosted immutable publication request
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_ACTIONS:-}" = "true"
          test "${RUNNER_ENVIRONMENT:-}" = "github-hosted"
          [[ "$DF_REQUESTED_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$DF_REQUESTED_SOURCE_COMMIT" = "$GITHUB_SHA"

      - name: Checkout exact requested commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false

      - name: Resolve and verify reviewed runtime pins
        id: pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DF_REQUESTED_SOURCE_COMMIT"
          test -s pnpm-lock.yaml
          test -s containers/mvp-runtime.Containerfile
          test -s containers/mvp-runtime-pins.json
          test "$(git status --porcelain=v1 --untracked-files=all)" = ""
          syntax_directive="$(head -n 1 containers/mvp-runtime.Containerfile)"
          if [[ "$syntax_directive" == "# syntax="* ]]; then
            [[ "$syntax_directive" =~ ^#[[:space:]]syntax=[A-Za-z0-9][A-Za-z0-9._:/-]{0,446}@sha256:[a-f0-9]{64}$ ]]
          fi

          jq -e '
            def exact_keys($expected):
              (keys | sort) == ($expected | sort);
            def sha256:
              type == "string" and test("^[a-f0-9]{64}$");
            def immutable_image:
              type == "string" and
              test("^[A-Za-z0-9][A-Za-z0-9._:/-]{0,446}@sha256:[a-f0-9]{64}$");
            def https_url:
              type == "string" and
              startswith("https://") and
              length <= 2048 and
              ((contains("\u0000") or contains("\r") or contains("\n")) | not);
            def semver:
              type == "string" and
              test("^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\\+[0-9A-Za-z.-]+)?$");
            . as $pins |
            exact_keys([
              "schemaVersion",
              "domain",
              "platform",
              "runtimeAbi",
              "runtimeBaseImage",
              "debianSnapshot",
              "buildxVersion",
              "buildkitImage",
              "node",
              "claudeCode",
              "bun",
              "harbor",
              "requiredExecutables",
              "reservedIds",
              "defaultUser",
              "maximumUncompressedBytes"
            ]) and
            .schemaVersion == 1 and
            .domain == "dark-factory.mvp-runtime-pins.v1" and
            .platform == "linux/amd64" and
            .runtimeAbi == "linux-x64-glibc" and
            (.runtimeBaseImage | immutable_image) and
            (.debianSnapshot |
              type == "string" and
              test("^[0-9]{8}T[0-9]{6}Z$")) and
            (.buildxVersion |
              type == "string" and
              test("^v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$")) and
            (.buildkitImage | immutable_image) and
            (.node |
              exact_keys([
                "version",
                "npmVersion",
                "url",
                "archiveSha256",
                "executable"
              ]) and
              (.version |
                type == "string" and
                test("^24\\.[0-9]+\\.[0-9]+$")) and
              (.npmVersion | semver) and
              (.url | https_url) and
              (.archiveSha256 | sha256) and
              .executable == "/usr/bin/node") and
            (.claudeCode |
              exact_keys([
                "version",
                "url",
                "archiveSha256",
                "executable"
              ]) and
              .version == "2.1.217" and
              (.url | https_url) and
              (.archiveSha256 | sha256) and
              .executable == "/usr/local/bin/claude") and
            (.bun |
              exact_keys([
                "version",
                "url",
                "archiveSha256",
                "executable",
                "variant",
                "target"
              ]) and
              (.version | semver) and
              (.url | https_url) and
              (.archiveSha256 | sha256) and
              .executable == "/usr/local/bin/bun" and
              .variant == "bun-linux-x64-baseline" and
              .target == "bun-linux-x64-baseline") and
            (.harbor |
              exact_keys([
                "version",
                "wheelUrl",
                "wheelSha256",
                "executable",
                "extra"
              ]) and
              .version == "0.20.0" and
              (.wheelUrl | https_url) and
              (.wheelSha256 | sha256) and
              .executable == "/usr/local/bin/harbor" and
              (.extra |
                type == "string" and
                test("^[a-z0-9][a-z0-9._-]{0,63}$"))) and
            (.requiredExecutables |
              type == "array" and
              length >= 13 and
              length <= 64 and
              length == (unique | length) and
              all(
                type == "string" and
                test("^/[A-Za-z0-9._+/-]+$")
              )) and
            ([
              "/bin/sh",
              "/bin/false",
              "/usr/bin/node",
              "/usr/bin/env",
              "/usr/bin/git",
              "/usr/bin/npm",
              "/usr/bin/tar",
              "/usr/bin/gzip",
              "/usr/bin/python3",
              "/usr/bin/sha256sum",
              "/usr/bin/mkdir",
              "/usr/bin/chown",
              "/usr/bin/pkill",
              "/usr/bin/pgrep",
              "/usr/local/bin/claude",
              "/usr/local/bin/harbor",
              "/usr/local/bin/bun"
            ] - .requiredExecutables | length == 0) and
            ($pins.requiredExecutables |
              index($pins.node.executable) != null) and
            ($pins.requiredExecutables |
              index($pins.claudeCode.executable) != null) and
            ($pins.requiredExecutables |
              index($pins.bun.executable) != null) and
            ($pins.requiredExecutables |
              index($pins.harbor.executable) != null) and
            .reservedIds == [65532, 65533] and
            (.defaultUser |
              exact_keys(["uid", "gid", "name"]) and
              (.uid |
                type == "number" and
                floor == . and
                . > 0 and
                . < 65532) and
              (.gid |
                type == "number" and
                floor == . and
                . > 0 and
                . < 65532) and
              (.name |
                type == "string" and
                test("^[a-z_][a-z0-9_-]{0,31}$"))) and
            (.maximumUncompressedBytes |
              type == "number" and
              floor == . and
              . >= 1 and
              . <= 5368709120)
          ' containers/mvp-runtime-pins.json >/dev/null

          {
            printf 'runtime_base_image=%s\n' \
              "$(jq -r '.runtimeBaseImage' containers/mvp-runtime-pins.json)"
            printf 'debian_snapshot=%s\n' \
              "$(jq -r '.debianSnapshot' containers/mvp-runtime-pins.json)"
            printf 'buildx_version=%s\n' \
              "$(jq -r '.buildxVersion' containers/mvp-runtime-pins.json)"
            printf 'buildkit_image=%s\n' \
              "$(jq -r '.buildkitImage' containers/mvp-runtime-pins.json)"
            printf 'node_version=%s\n' \
              "$(jq -r '.node.version' containers/mvp-runtime-pins.json)"
            printf 'claude_code_version=%s\n' \
              "$(jq -r '.claudeCode.version' containers/mvp-runtime-pins.json)"
            printf 'bun_version=%s\n' \
              "$(jq -r '.bun.version' containers/mvp-runtime-pins.json)"
            printf 'harbor_version=%s\n' \
              "$(jq -r '.harbor.version' containers/mvp-runtime-pins.json)"
            printf 'default_uid=%s\n' \
              "$(jq -r '.defaultUser.uid' containers/mvp-runtime-pins.json)"
            printf 'default_gid=%s\n' \
              "$(jq -r '.defaultUser.gid' containers/mvp-runtime-pins.json)"
            printf 'maximum_uncompressed_bytes=%s\n' \
              "$(jq -r '.maximumUncompressedBytes' containers/mvp-runtime-pins.json)"
            printf 'pins_sha256=%s\n' \
              "$(sha256sum containers/mvp-runtime-pins.json | cut -d' ' -f1)"
            printf 'containerfile_sha256=%s\n' \
              "$(sha256sum containers/mvp-runtime.Containerfile | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve lowercase GHCR image name
        id: image-name
        shell: bash
        run: |
          set -euo pipefail
          repository="${GITHUB_REPOSITORY,,}"
          printf 'reference=ghcr.io/%s-dark-factory-mvp-runtime\n' \
            "$repository" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up isolated BuildKit builder
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        with:
          version: ${{ steps.pins.outputs.buildx_version }}
          driver-opts: |
            image=${{ steps.pins.outputs.buildkit_image }}

      - name: Build, attest, and publish the combined MVP runtime
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: containers/mvp-runtime.Containerfile
          platforms: linux/amd64
          pull: true
          no-cache: true
          push: true
          tags: ${{ steps.image-name.outputs.reference }}:${{ env.DF_IMAGE_TAG }}
          build-args: |
            RUNTIME_BASE_IMAGE=${{ steps.pins.outputs.runtime_base_image }}
            SOURCE_COMMIT=${{ inputs.source_commit }}
            DEBIAN_SNAPSHOT=${{ steps.pins.outputs.debian_snapshot }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ inputs.source_commit }}
            io.parallaxai.dark-factory.role=mvp-runtime
            io.parallaxai.dark-factory.node-version=${{ steps.pins.outputs.node_version }}
            io.parallaxai.dark-factory.claude-code-version=${{ steps.pins.outputs.claude_code_version }}
            io.parallaxai.dark-factory.bun-version=${{ steps.pins.outputs.bun_version }}
            io.parallaxai.dark-factory.harbor-version=${{ steps.pins.outputs.harbor_version }}
          provenance: mode=max
          sbom: true

      - name: Smoke the exact published digest without network
        id: smoke
        shell: bash
        env:
          DF_IMAGE_REFERENCE: ${{ steps.image-name.outputs.reference }}
          DF_IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          DF_EXPECTED_UID: ${{ steps.pins.outputs.default_uid }}
          DF_EXPECTED_GID: ${{ steps.pins.outputs.default_gid }}
          DF_MAXIMUM_UNCOMPRESSED_BYTES: ${{ steps.pins.outputs.maximum_uncompressed_bytes }}
        run: |
          set -euo pipefail
          [[ "$DF_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          immutable_reference="$DF_IMAGE_REFERENCE@$DF_IMAGE_DIGEST"
          docker pull --platform linux/amd64 "$immutable_reference"

          test "$(docker image inspect --format '{{.Os}}' "$immutable_reference")" = "linux"
          test "$(docker image inspect --format '{{.Architecture}}' "$immutable_reference")" = "amd64"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$immutable_reference")" = "$DF_REQUESTED_SOURCE_COMMIT"
          test "$(docker image inspect --format '{{index .Config.Labels "io.parallaxai.dark-factory.role"}}' "$immutable_reference")" = "mvp-runtime"
          test "$(docker image inspect --format '{{.Config.User}}' "$immutable_reference")" = "$DF_EXPECTED_UID:$DF_EXPECTED_GID"

          uncompressed_bytes="$(docker image inspect --format '{{.Size}}' "$immutable_reference")"
          [[ "$uncompressed_bytes" =~ ^[0-9]+$ ]]
          test "$uncompressed_bytes" -le "$DF_MAXIMUM_UNCOMPRESSED_BYTES"

          mkdir -p image-output
          cat > "$RUNNER_TEMP/mvp-runtime-smoke.mjs" <<'EOF'
          import { createHash } from "node:crypto";
          import {
            chmodSync,
            mkdirSync,
            readFileSync,
            statSync,
            writeFileSync,
          } from "node:fs";
          import { spawnSync } from "node:child_process";

          const fail = (message) => {
            process.stderr.write(`${message}\n`);
            process.exit(78);
          };
          const pins = JSON.parse(
            readFileSync("/mvp-runtime-pins.json", "utf8"),
          );
          const run = (command, arguments_) => {
            const result = spawnSync(command, arguments_, {
              encoding: "utf8",
              env: {
                HOME: "/tmp/home",
                LANG: "C",
                LC_ALL: "C",
                PATH: "/usr/local/bin:/usr/bin:/bin",
              },
              maxBuffer: 8 * 1024 * 1024,
              shell: false,
              timeout: 120_000,
            });
            if (
              result.error ||
              result.signal !== null ||
              result.status !== 0
            ) {
              fail(`Offline runtime probe failed for ${command}.`);
            }
            return `${result.stdout}\n${result.stderr}`.trim();
          };
          const digest = (path) =>
            createHash("sha256").update(readFileSync(path)).digest("hex");
          const versionAppears = (output, version) =>
            output === version ||
            output === `v${version}` ||
            output.includes(version);

          if (
            process.platform !== "linux" ||
            process.arch !== "x64" ||
            process.getuid?.() !== pins.defaultUser.uid ||
            process.getgid?.() !== pins.defaultUser.gid
          ) {
            fail("The runtime platform or default identity changed.");
          }
          const glibcVersion =
            process.report?.getReport()?.header?.glibcVersionRuntime;
          if (
            typeof glibcVersion !== "string" ||
            !/^[0-9]+\.[0-9]+$/u.test(glibcVersion)
          ) {
            fail("The runtime is not a measurable glibc environment.");
          }

          const passwd = readFileSync("/etc/passwd", "utf8")
            .split("\n")
            .filter(Boolean)
            .map((line) => line.split(":"));
          const groups = readFileSync("/etc/group", "utf8")
            .split("\n")
            .filter(Boolean)
            .map((line) => line.split(":"));
          if (
            !passwd.some(
              (entry) =>
                entry[0] === pins.defaultUser.name &&
                Number(entry[2]) === pins.defaultUser.uid &&
                Number(entry[3]) === pins.defaultUser.gid,
            ) ||
            pins.reservedIds.some(
              (id) =>
                passwd.some((entry) => Number(entry[2]) === id) ||
                groups.some((entry) => Number(entry[2]) === id),
            )
          ) {
            fail("The image identity reservation is invalid.");
          }

          const executables = {};
          for (const path of pins.requiredExecutables) {
            const metadata = statSync(path);
            if (
              !metadata.isFile() ||
              (metadata.mode & 0o111) === 0 ||
              metadata.uid !== 0 ||
              metadata.gid !== 0 ||
              (metadata.mode & 0o022) !== 0
            ) {
              fail(`Required executable is invalid: ${path}`);
            }
            executables[path] = {
              byteLength: metadata.size,
              gid: metadata.gid,
              mode: metadata.mode & 0o7777,
              sha256: digest(path),
              uid: metadata.uid,
            };
          }

          mkdirSync("/tmp/home", { recursive: true, mode: 0o700 });
          const nullDevice = statSync("/dev/null");
          const caBundle = statSync("/etc/ssl/certs/ca-certificates.crt");
          if (
            !nullDevice.isCharacterDevice() ||
            !caBundle.isFile() ||
            caBundle.size < 1 ||
            !run("/usr/bin/tar", ["--version"]).includes("GNU tar")
          ) {
            fail("A required system-runtime contract is missing.");
          }
          const versions = {
            node: run(pins.node.executable, ["--version"]),
            npm: run("/usr/bin/npm", ["--version"]),
            claudeCode: run(pins.claudeCode.executable, ["--version"]),
            bun: run(pins.bun.executable, ["--version"]),
            harbor: run(pins.harbor.executable, ["--version"]),
          };
          if (
            versions.node !== `v${pins.node.version}` ||
            versions.npm !== pins.node.npmVersion ||
            !versionAppears(
              versions.claudeCode,
              pins.claudeCode.version,
            ) ||
            !versionAppears(versions.bun, pins.bun.version) ||
            !versionAppears(versions.harbor, pins.harbor.version)
          ) {
            fail("A runtime tool version does not match its reviewed pin.");
          }

          writeFileSync(
            "/tmp/mvp-runtime-probe.ts",
            'process.stdout.write("mvp-runtime-ok\\n");\n',
            { encoding: "utf8", mode: 0o600 },
          );
          run(pins.bun.executable, [
            "build",
            "--compile",
            `--target=${pins.bun.target}`,
            "/tmp/mvp-runtime-probe.ts",
            "--outfile",
            "/tmp/mvp-runtime-probe",
          ]);
          chmodSync("/tmp/mvp-runtime-probe", 0o700);
          if (run("/tmp/mvp-runtime-probe", []) !== "mvp-runtime-ok") {
            fail("The pinned Bun compiler did not produce a working runtime.");
          }

          process.stdout.write(
            `${JSON.stringify({
              schemaVersion: 1,
              domain: "dark-factory.mvp-runtime-offline-smoke.v1",
              platform: "linux/amd64",
              architecture: "x86_64",
              runtimeAbi: pins.runtimeAbi,
              glibcVersion,
              defaultUser: pins.defaultUser,
              reservedIdsUnused: pins.reservedIds,
              versions,
              executables,
              bunCompileTarget: pins.bun.target,
              network: "none",
              status: "passed",
            })}\n`,
          );
          EOF

          cat > "$RUNNER_TEMP/mvp-runtime-root-probe.mjs" <<'EOF'
          import {
            chownSync,
            mkdirSync,
            readFileSync,
          } from "node:fs";
          import { spawnSync } from "node:child_process";

          const pins = JSON.parse(
            readFileSync("/mvp-runtime-pins.json", "utf8"),
          );
          if (process.getuid?.() !== 0 || process.getgid?.() !== 0) {
            process.exit(78);
          }
          for (const id of pins.reservedIds) {
            const directory = `/tmp/identity-${id}`;
            mkdirSync(directory, { mode: 0o700 });
            chownSync(directory, id, id);
            const result = spawnSync(
              pins.node.executable,
              [
                "-e",
                "const fs=require('node:fs');const id=Number(process.argv[1]);if(process.getuid()!==id||process.getgid()!==id)process.exit(78);fs.writeFileSync(process.argv[2],String(id));",
                String(id),
                `${directory}/probe`,
              ],
              {
                encoding: "utf8",
                env: {
                  HOME: directory,
                  LANG: "C",
                  LC_ALL: "C",
                  PATH: "/usr/local/bin:/usr/bin:/bin",
                },
                gid: id,
                shell: false,
                timeout: 30_000,
                uid: id,
              },
            );
            if (
              result.error ||
              result.signal !== null ||
              result.status !== 0
            ) {
              process.exit(78);
            }
          }
          EOF

          docker run --rm \
            --platform linux/amd64 \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=512m \
            --mount "type=bind,src=$RUNNER_TEMP/mvp-runtime-smoke.mjs,dst=/mvp-runtime-smoke.mjs,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/containers/mvp-runtime-pins.json,dst=/mvp-runtime-pins.json,readonly" \
            --entrypoint /usr/bin/node \
            "$immutable_reference" \
            /mvp-runtime-smoke.mjs > image-output/smoke.json

          docker run --rm \
            --platform linux/amd64 \
            --user 0:0 \
            --network none \
            --read-only \
            --cap-drop ALL \
            --cap-add CHOWN \
            --cap-add SETGID \
            --cap-add SETUID \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=64m \
            --mount "type=bind,src=$RUNNER_TEMP/mvp-runtime-root-probe.mjs,dst=/mvp-runtime-root-probe.mjs,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/containers/mvp-runtime-pins.json,dst=/mvp-runtime-pins.json,readonly" \
            --entrypoint /usr/bin/node \
            "$immutable_reference" \
            /mvp-runtime-root-probe.mjs

          jq -e '
            .schemaVersion == 1 and
            .domain == "dark-factory.mvp-runtime-offline-smoke.v1" and
            .platform == "linux/amd64" and
            .architecture == "x86_64" and
            .runtimeAbi == "linux-x64-glibc" and
            .network == "none" and
            .status == "passed"
          ' image-output/smoke.json >/dev/null
          jq -cS . image-output/smoke.json \
            > image-output/smoke.canonical.json
          mv image-output/smoke.canonical.json image-output/smoke.json

          {
            printf 'uncompressed_bytes=%s\n' "$uncompressed_bytes"
            printf 'smoke_sha256=%s\n' \
              "$(sha256sum image-output/smoke.json | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

      - name: Seal the task-free immutable digest receipt
        shell: bash
        env:
          DF_IMAGE_REFERENCE: ${{ steps.image-name.outputs.reference }}
          DF_IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          DF_RUNTIME_BASE_IMAGE: ${{ steps.pins.outputs.runtime_base_image }}
          DF_BUILDX_VERSION: ${{ steps.pins.outputs.buildx_version }}
          DF_BUILDKIT_IMAGE: ${{ steps.pins.outputs.buildkit_image }}
          DF_PINS_SHA256: ${{ steps.pins.outputs.pins_sha256 }}
          DF_CONTAINERFILE_SHA256: ${{ steps.pins.outputs.containerfile_sha256 }}
          DF_UNCOMPRESSED_BYTES: ${{ steps.smoke.outputs.uncompressed_bytes }}
          DF_SMOKE_SHA256: ${{ steps.smoke.outputs.smoke_sha256 }}
        run: |
          set -euo pipefail
          [[ "$DF_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$DF_PINS_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$DF_CONTAINERFILE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$DF_SMOKE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$DF_UNCOMPRESSED_BYTES" =~ ^[0-9]+$ ]]

          jq -cS -n \
            --slurpfile pins containers/mvp-runtime-pins.json \
            --slurpfile smoke image-output/smoke.json \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg sourceCommit "$DF_REQUESTED_SOURCE_COMMIT" \
            --arg workflowRef "$GITHUB_WORKFLOW_REF" \
            --arg workflowSha "$GITHUB_WORKFLOW_SHA" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg taggedReference "$DF_IMAGE_REFERENCE:$DF_IMAGE_TAG" \
            --arg immutableReference "$DF_IMAGE_REFERENCE@$DF_IMAGE_DIGEST" \
            --arg digest "$DF_IMAGE_DIGEST" \
            --arg runtimeBaseImage "$DF_RUNTIME_BASE_IMAGE" \
            --arg buildxVersion "$DF_BUILDX_VERSION" \
            --arg buildkitImage "$DF_BUILDKIT_IMAGE" \
            --arg pinsSha256 "$DF_PINS_SHA256" \
            --arg containerfileSha256 "$DF_CONTAINERFILE_SHA256" \
            --arg smokeSha256 "$DF_SMOKE_SHA256" \
            --argjson uncompressedBytes "$DF_UNCOMPRESSED_BYTES" \
            '{
              schemaVersion: 1,
              domain: "dark-factory.mvp-runtime-image-receipt.v1",
              source: {
                repository: $repository,
                commit: $sourceCommit
              },
              workflow: {
                ref: $workflowRef,
                sha: $workflowSha,
                runId: $runId,
                runAttempt: $runAttempt
              },
              buildInputs: {
                runtimeBaseImage: $runtimeBaseImage,
                buildxVersion: $buildxVersion,
                buildkitImage: $buildkitImage,
                pinsPath: "containers/mvp-runtime-pins.json",
                pinsSha256: $pinsSha256,
                containerfilePath: "containers/mvp-runtime.Containerfile",
                containerfileSha256: $containerfileSha256,
                pins: $pins[0]
              },
              image: {
                taggedReference: $taggedReference,
                immutableReference: $immutableReference,
                digest: $digest,
                platform: "linux/amd64",
                runtimeAbi: "linux-x64-glibc",
                uncompressedBytes: $uncompressedBytes
              },
              attestations: {
                sbom: "oci-attestation",
                provenance: "mode=max"
              },
              smoke: ($smoke[0] + {
                evidenceSha256: $smokeSha256
              })
            }' > image-output/mvp-runtime.json

          jq -e '
            .schemaVersion == 1 and
            .domain == "dark-factory.mvp-runtime-image-receipt.v1" and
            (.image.digest |
              test("^sha256:[a-f0-9]{64}$")) and
            .smoke.status == "passed"
          ' image-output/mvp-runtime.json >/dev/null
          sha256sum image-output/mvp-runtime.json \
            > image-output/mvp-runtime.json.sha256

          {
            printf '### Combined MVP runtime image\n\n'
            printf -- '- Immutable reference: `%s@%s`\n' \
              "$DF_IMAGE_REFERENCE" "$DF_IMAGE_DIGEST"
            printf -- '- Platform/ABI: `linux/amd64`, `linux-x64-glibc`\n'
            printf -- '- Uncompressed image bytes: `%s`\n' \
              "$DF_UNCOMPRESSED_BYTES"
            printf -- '- Exact-digest offline smoke: passed\n'
            printf -- '- SBOM and max-mode provenance: OCI attestations attached in GHCR\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable digest receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dark-factory-mvp-runtime-${{ inputs.source_commit }}
          path: |
            image-output/mvp-runtime.json
            image-output/mvp-runtime.json.sha256
          if-no-files-found: error
          retention-days: 90
