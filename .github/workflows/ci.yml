name: cloud-quality-gates

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "claude-plugin/**"
      - "containers/**"
      - ".dockerignore"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig*.json"
      - "biome.json"
      - "vitest.config.ts"
      - ".github/workflows/**"
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RUN CLOUD QUALITY GATES
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: dark-factory-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.confirmation == 'RUN CLOUD QUALITY GATES'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
      RUNNER_ENVIRONMENT: ${{ runner.environment }}
      DF_CLOUD_EXECUTION: "1"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Verify cloud-hosted runner
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_ACTIONS:-}" = "true"
          test "${RUNNER_ENVIRONMENT:-}" = "github-hosted"

      - name: Checkout exact workflow revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Require the reviewed dependency lock
        shell: bash
        run: |
          set -euo pipefail
          test -s pnpm-lock.yaml
          test "$(git status --porcelain=v1 --untracked-files=no)" = ""

      - name: Set up exact Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0

      - name: Activate exact pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          test "$(pnpm --version)" = "11.9.0"

      - name: Install from the reviewed lock
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Run lint, typecheck, and tests with coverage
        shell: bash
        run: pnpm check

      - name: Build distributable cloud code
        shell: bash
        run: pnpm build
