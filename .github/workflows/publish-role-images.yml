name: publish-role-images

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact 40-character main-branch commit to build
        required: true
        type: string
      confirmation:
        description: Type PUBLISH:<source_commit>
        required: true
        type: string
      control_base_image:
        description: Immutable control base image (name@sha256:digest)
        required: true
        type: string
      optimizer_base_image:
        description: Immutable optimizer base image (name@sha256:digest)
        required: true
        type: string
      build_base_image:
        description: Immutable candidate-build base image (name@sha256:digest)
        required: true
        type: string
      evaluator_base_image:
        description: Immutable evaluator base image (name@sha256:digest)
        required: true
        type: string
      claude_code_version:
        description: Exact Claude Code semver selected by the operator
        required: true
        type: string
      harbor_version:
        description: Exact Harbor semver matching the frozen benchmark pin
        required: true
        type: string
      buildx_version:
        description: Exact Docker Buildx release selected by the operator
        required: true
        type: string
      buildkit_image:
        description: Immutable BuildKit driver image (name@sha256:digest)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: dark-factory-role-images-${{ inputs.source_commit }}
  cancel-in-progress: false

jobs:
  quality:
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.confirmation == format('PUBLISH:{0}', inputs.source_commit)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CI: "true"
      RUNNER_ENVIRONMENT: ${{ runner.environment }}
      DF_CLOUD_EXECUTION: "1"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      DF_REQUESTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
    steps:
      - name: Verify cloud-hosted protected source
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_ACTIONS:-}" = "true"
          test "${RUNNER_ENVIRONMENT:-}" = "github-hosted"
          [[ "$DF_REQUESTED_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$DF_REQUESTED_SOURCE_COMMIT" = "$GITHUB_SHA"

      - name: Checkout exact requested commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false

      - name: Require immutable source and dependency lock
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DF_REQUESTED_SOURCE_COMMIT"
          test -s pnpm-lock.yaml
          test "$(git status --porcelain=v1 --untracked-files=no)" = ""

      - name: Set up exact Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0

      - name: Install and verify
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          test "$(pnpm --version)" = "11.9.0"
          pnpm install --frozen-lockfile
          pnpm check
          pnpm build

  publish:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: dark-factory-image-publish
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - role: control
            containerfile: containers/control.Containerfile
            base_image: ${{ inputs.control_base_image }}
          - role: optimizer
            containerfile: containers/optimizer.Containerfile
            base_image: ${{ inputs.optimizer_base_image }}
          - role: build
            containerfile: containers/build.Containerfile
            base_image: ${{ inputs.build_base_image }}
          - role: evaluator
            containerfile: containers/evaluator.Containerfile
            base_image: ${{ inputs.evaluator_base_image }}
    env:
      CI: "true"
      RUNNER_ENVIRONMENT: ${{ runner.environment }}
      DF_CLOUD_EXECUTION: "1"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      DF_REQUESTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
      DF_ROLE: ${{ matrix.role }}
      DF_ROLE_BASE_IMAGE: ${{ matrix.base_image }}
      DF_CLAUDE_CODE_VERSION: ${{ inputs.claude_code_version }}
      DF_HARBOR_VERSION: ${{ inputs.harbor_version }}
      DF_BUILDX_VERSION: ${{ inputs.buildx_version }}
      DF_BUILDKIT_IMAGE: ${{ inputs.buildkit_image }}
      DF_IMAGE_TAG: ${{ inputs.source_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Verify cloud-hosted immutable build inputs
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_ACTIONS:-}" = "true"
          test "${RUNNER_ENVIRONMENT:-}" = "github-hosted"
          [[ "$DF_REQUESTED_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DF_ROLE_BASE_IMAGE" =~ ^[A-Za-z0-9][A-Za-z0-9._:/-]{0,446}@sha256:[0-9a-f]{64}$ ]]
          [[ "$DF_CLAUDE_CODE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]
          [[ "$DF_HARBOR_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]
          [[ "$DF_BUILDX_VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]
          [[ "$DF_BUILDKIT_IMAGE" =~ ^[A-Za-z0-9][A-Za-z0-9._:/-]{0,446}@sha256:[0-9a-f]{64}$ ]]

      - name: Checkout exact requested commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false

      - name: Prove checked-out source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DF_REQUESTED_SOURCE_COMMIT"
          test -s pnpm-lock.yaml
          test "$(git status --porcelain=v1 --untracked-files=no)" = ""

      - name: Resolve lowercase GHCR name
        id: image-name
        shell: bash
        run: |
          set -euo pipefail
          repository="${GITHUB_REPOSITORY,,}"
          printf 'reference=ghcr.io/%s-dark-factory-%s\n' \
            "$repository" "$DF_ROLE" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up isolated BuildKit builder
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        with:
          version: ${{ inputs.buildx_version }}
          driver-opts: |
            image=${{ inputs.buildkit_image }}

      - name: Build, attest, and publish role image
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ${{ matrix.containerfile }}
          platforms: linux/amd64
          pull: true
          no-cache: true
          push: true
          tags: ${{ steps.image-name.outputs.reference }}:${{ env.DF_IMAGE_TAG }}
          build-args: |
            ROLE_BASE_IMAGE=${{ matrix.base_image }}
            SOURCE_COMMIT=${{ inputs.source_commit }}
            CLAUDE_CODE_VERSION=${{ inputs.claude_code_version }}
            HARBOR_VERSION=${{ inputs.harbor_version }}
          labels: |
            org.opencontainers.image.revision=${{ inputs.source_commit }}
            io.parallaxai.dark-factory.role=${{ matrix.role }}
            io.parallaxai.dark-factory.claude-code-version=${{ inputs.claude_code_version }}
            io.parallaxai.dark-factory.harbor-version=${{ inputs.harbor_version }}
          provenance: mode=max
          sbom: true

      - name: Seal digest receipt
        shell: bash
        env:
          DF_IMAGE_REFERENCE: ${{ steps.image-name.outputs.reference }}
          DF_IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DF_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p image-output
          jq -cS -n \
            --arg role "$DF_ROLE" \
            --arg sourceCommit "$DF_REQUESTED_SOURCE_COMMIT" \
            --arg taggedReference "$DF_IMAGE_REFERENCE:$DF_IMAGE_TAG" \
            --arg immutableReference "$DF_IMAGE_REFERENCE@$DF_IMAGE_DIGEST" \
            --arg digest "$DF_IMAGE_DIGEST" \
            --arg baseImage "$DF_ROLE_BASE_IMAGE" \
            --arg claudeCodeVersion "$DF_CLAUDE_CODE_VERSION" \
            --arg harborVersion "$DF_HARBOR_VERSION" \
            --arg buildxVersion "$DF_BUILDX_VERSION" \
            --arg buildkitImage "$DF_BUILDKIT_IMAGE" \
            '{
              schemaVersion: 1,
              domain: "dark-factory.role-image-receipt.v1",
              role: $role,
              sourceCommit: $sourceCommit,
              taggedReference: $taggedReference,
              immutableReference: $immutableReference,
              digest: $digest,
              baseImage: $baseImage,
              claudeCodeVersion: $claudeCodeVersion,
              harborVersion: $harborVersion,
              buildxVersion: $buildxVersion,
              buildkitImage: $buildkitImage,
              sbom: "oci-attestation",
              provenance: "oci-attestation"
            }' > "image-output/$DF_ROLE.json"
          sha256sum "image-output/$DF_ROLE.json" \
            > "image-output/$DF_ROLE.json.sha256"
          {
            printf '### %s image\n\n' "$DF_ROLE"
            printf -- '- Immutable reference: `%s@%s`\n' \
              "$DF_IMAGE_REFERENCE" "$DF_IMAGE_DIGEST"
            printf -- '- SBOM and max-mode provenance: OCI attestations attached in GHCR\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload digest receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dark-factory-${{ matrix.role }}-${{ inputs.source_commit }}
          path: image-output/
          if-no-files-found: error
          retention-days: 30
