name: bootstrap-pnpm-lockfile-review-artifact

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact 40-character commit to resolve
        required: true
        type: string
      confirmation:
        description: Type GENERATE PNPM LOCKFILE
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: dark-factory-lockfile-bootstrap
  cancel-in-progress: false

jobs:
  generate-review-artifact:
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.confirmation == 'GENERATE PNPM LOCKFILE'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: "true"
      RUNNER_ENVIRONMENT: ${{ runner.environment }}
      DF_CLOUD_EXECUTION: "1"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      DF_REQUESTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
    steps:
      - name: Verify cloud-hosted runner and immutable source request
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_ACTIONS:-}" = "true"
          test "${RUNNER_ENVIRONMENT:-}" = "github-hosted"
          [[ "$DF_REQUESTED_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$DF_REQUESTED_SOURCE_COMMIT" = "$GITHUB_SHA"

      - name: Checkout exact requested commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false

      - name: Prove this is the one-time bootstrap path
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DF_REQUESTED_SOURCE_COMMIT"
          if test -e pnpm-lock.yaml; then
            echo "pnpm-lock.yaml already exists; use the normal quality workflow." >&2
            exit 78
          fi
          test "$(git status --porcelain=v1 --untracked-files=no)" = ""

      - name: Set up exact Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0

      - name: Activate exact pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          test "$(pnpm --version)" = "11.9.0"

      - name: Resolve a lockfile without lifecycle scripts
        shell: bash
        run: pnpm install --lockfile-only --ignore-scripts

      - name: Admit only the generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          test -s pnpm-lock.yaml
          git diff --exit-code -- package.json
          git diff --check -- pnpm-lock.yaml
          unexpected="$(
            git status --porcelain=v1 --untracked-files=all |
              grep -v '^?? pnpm-lock.yaml$' || true
          )"
          test -z "$unexpected"
          sha256sum pnpm-lock.yaml > pnpm-lock.yaml.sha256

      - name: Upload immutable review artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pnpm-lockfile-${{ inputs.source_commit }}
          path: |
            pnpm-lock.yaml
            pnpm-lock.yaml.sha256
          if-no-files-found: error
          retention-days: 14
